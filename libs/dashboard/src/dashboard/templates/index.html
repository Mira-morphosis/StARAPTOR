<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analytics</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script src="/static/dashboard.js" defer></script>

    <style>
      @keyframes shiftGradient {
        0% { background-position: 200% 0; }
        100% { background-position: 0% 0; }
      }
      .animate-shift-gradient {
        background-size: 200% 100%;
        animation: shiftGradient 2s linear infinite;
      }
    </style>
  </head>
  <body class="bg-gradient-to-b from-[#2a475e] to-[#1b2838] text-white font-sans antialiased min-h-screen flex flex-col justify-between">

  <div class="min-h-screen w-full flex flex-col justify-between">

    <!-- HEADER / NAVBAR -->
    <header class="flex items-center justify-between px-4 sm:px-6 w-full min-h-[56px] bg-[#171d25] border-b border-white/5 relative z-10 shrink-0">

      <div id="game-selector-container"
        class="relative"
        hx-get="/api/current-game?app_id={{ app_id }}"
        hx-trigger="load"
        hx-swap="innerHTML">
        <div class="flex items-center gap-x-2 animate-pulse">
          <div class="size-6 bg-white/10 rounded"></div>
          <div class="h-3.5 w-20 bg-white/10 rounded"></div>
        </div>
      </div>

      <div class="flex items-center gap-x-3">
        <div id="last-updated-container"
             class="flex flex-col items-end sm:items-start"
             hx-get="/api/last-updated?app_id={{ app_id }}"
             hx-trigger="load, updateLastUpdated from:body"
             hx-swap="innerHTML">
          <span class="text-white font-semibold text-[8px] sm:text-[9px] leading-[1.1]">LAST UPDATED:</span>
          <span class="text-white/70 text-[11px] sm:text-xs leading-[1.1]">--</span>
        </div>
        <button
          class="flex items-center justify-center size-7 bg-[#1a9fff] hover:bg-[#1582d1] transition rounded-sm cursor-pointer"
          hx-post="/api/refresh?app_id={{ app_id }}"
          hx-target="#associations-list"
          hx-swap="innerHTML"
          title="Refresh data">
          <svg class="size-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </header>

    <div id="scheduled-update-banner"
         hx-get="/api/banner-status?app_id={{ app_id }}"
         hx-trigger="load, updateBanner from:body"
         hx-swap="outerHTML"></div>

    <main class="flex-1 w-full max-w-[1920px] mx-auto p-4 sm:p-5 lg:p-6 flex flex-col gap-4">

      <h1 class="text-white font-semibold text-2xl sm:text-3xl leading-[1.2]">
        Dashboard
      </h1>

      <div class="grid grid-cols-1 xl:grid-cols-2 gap-5 sm:gap-6 items-start w-full">

        <div class="flex flex-col p-4 sm:p-5 lg:p-6 items-center justify-between bg-gradient-to-bl from-[#5e6376] to-[#323b4a] rounded-[20px] sm:rounded-[28px] shadow-[0_4px_23px_4px_#00000033] w-full aspect-square max-w-[560px] justify-self-center">
          <div class="text-white/70 text-xs sm:text-sm font-medium leading-tight text-center w-full uppercase tracking-wider">
            Forecasted Player Count (Next 30 Days)
          </div>

          <div class="relative w-full flex-1 mt-3 rounded-lg overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-[#284359] to-[#181f31] border border-[#e3e3e3]/80 shadow-[2px_2px_4px_0_#00000033]"></div>
            <div class="absolute inset-0 p-2.5 sm:p-3">
              <canvas id="forecastChart" class="w-full h-full"></canvas>
            </div>
          </div>
        </div>

        <div class="flex flex-col p-4 sm:p-5 lg:p-6 gap-y-2.5 items-stretch justify-start w-full bg-gradient-to-r from-black/50 to-black/65 xl:self-stretch">

          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-1 w-full">
            <div class="text-[#c6d4df]/70 text-xs sm:text-sm font-medium leading-tight">
              Associations found in the reviews:
            </div>
            <a href="/reviews?app_id={{ app_id }}"
              class="w-full sm:w-auto px-5 py-2 bg-[#1a9fff] hover:bg-[#1582d1] rounded text-white text-xs sm:text-sm leading-tight font-normal transition flex items-center justify-center shrink-0 cursor-pointer">
              Read Reviews
            </a>
          </div>

          <div id="associations-list"
               class="flex flex-col gap-y-2 w-full"
               hx-get="/api/associations?app_id={{ app_id }}"
               hx-trigger="load"
               hx-swap="innerHTML">

            <div class="h-10 w-full bg-white/5 rounded animate-pulse"></div>
            <div class="h-10 w-full bg-white/5 rounded animate-pulse"></div>
            <div class="h-10 w-full bg-white/5 rounded animate-pulse"></div>
          </div>

        </div>

      </div>
    </main>

  </div>

  </body>
</html>
